<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="450" viewBox="0 0 900 450"
     role="img" aria-labelledby="title desc">
  <title id="title">Pixel Snake — 30 by 15 grid</title>
  <desc id="desc">A seven-segment pixel snake moves through a thirty-column by fifteen-row grid.</desc>

  <defs>
    <pattern id="pixel-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#07130e"/>
      <rect x="1" y="1" width="28" height="28" fill="#0a1b14"/>
      <path d="M30 0H0V30" fill="none" stroke="#3d8067" stroke-opacity="0.34"/>
    </pattern>
  </defs>

  <!-- Exactly 30 columns × 15 rows. -->
  <rect width="900" height="450" fill="url(#pixel-grid)"/>
  <rect x="1" y="1" width="898" height="448"
        fill="none" stroke="#43d79e" stroke-opacity="0.72" stroke-width="2"/>

  <!-- Closed pseudo-random route, aligned to the center of grid cells. -->
  <path id="snake-route" d="M195 75H735V165H525V315H825V405H315V285H105V135H195V75" fill="none" stroke="none"/>

  <!-- Static fallback for renderers without SVG animation support. -->
  <g id="snake-fallback" shape-rendering="crispEdges">
    <rect x="185" y="65" width="20" height="20" fill="#55efb1"/>
    <rect x="185" y="95" width="20" height="20" fill="#45dca2"/>
    <rect x="185" y="125" width="20" height="20" fill="#39c992"/>
    <rect x="155" y="125" width="20" height="20" fill="#2daf7e"/>
    <rect x="125" y="125" width="20" height="20" fill="#258d68"/>
    <rect x="95" y="125" width="20" height="20" fill="#1d6d51"/>
    <rect x="95" y="155" width="20" height="20" fill="#174d3b"/>
    <set attributeName="opacity" to="0" begin="0s"/>
  </g>

  <!-- Seven pixel segments, spaced by exactly one cell. -->
  <g id="snake-live" shape-rendering="crispEdges">
    <rect x="-10" y="-10" width="20" height="20" fill="#55efb1">
      <animateMotion dur="16s" begin="0s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#45dca2">
      <animateMotion dur="16s" begin="-0.19s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#39c992">
      <animateMotion dur="16s" begin="-0.38s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#2daf7e">
      <animateMotion dur="16s" begin="-0.57s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#258d68">
      <animateMotion dur="16s" begin="-0.76s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#1d6d51">
      <animateMotion dur="16s" begin="-0.95s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#174d3b">
      <animateMotion dur="16s" begin="-1.14s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
  </g>
</svg>
