<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="450" viewBox="0 0 900 450"
     role="img" aria-labelledby="title desc">
  <title id="title">Pixel Snake — 30 by 15 grid</title>
  <desc id="desc">A seven-segment pixel snake moves through a thirty-column by fifteen-row grid.</desc>

  <defs>
    <pattern id="pixel-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#07130e"/>
      <rect x="1" y="1" width="28" height="28" fill="#0a1b14"/>
      <path d="M30 0H0V30" fill="none" stroke="#3d8067" stroke-opacity="0.34"/>
    </pattern>
  </defs>

  <!-- Exactly 30 columns × 15 rows. -->
  <rect width="900" height="450" fill="url(#pixel-grid)"/>
  <rect x="1" y="1" width="898" height="448"
        fill="none" stroke="#43d79e" stroke-opacity="0.72" stroke-width="2"/>

  <!-- Food pixel: column 15, row 1. -->
  <g shape-rendering="crispEdges">
    <rect x="455" y="35" width="20" height="20" fill="#d8f36d">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="462" y="30" width="6" height="5" fill="#55e6aa"/>
  </g>

  <!-- Route coordinates remain centered inside grid cells. -->
  <path id="snake-route" d="M255 45H855V405H45V45H255" fill="none" stroke="none"/>

  <!-- Static fallback for renderers without SVG animation support. -->
  <g id="snake-fallback" shape-rendering="crispEdges">
    <rect x="245" y="35" width="20" height="20" fill="#55efb1"/>
    <rect x="215" y="35" width="20" height="20" fill="#45dca2"/>
    <rect x="185" y="35" width="20" height="20" fill="#39c992"/>
    <rect x="155" y="35" width="20" height="20" fill="#2daf7e"/>
    <rect x="125" y="35" width="20" height="20" fill="#258d68"/>
    <rect x="95" y="35" width="20" height="20" fill="#1d6d51"/>
    <rect x="65" y="35" width="20" height="20" fill="#174d3b"/>
    <set attributeName="opacity" to="0" begin="0s"/>
  </g>

  <!-- Seven pixel segments, spaced by exactly one cell. -->
  <g id="snake-live" shape-rendering="crispEdges">
    <rect x="-10" y="-10" width="20" height="20" fill="#55efb1">
      <animateMotion dur="14s" begin="0s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#45dca2">
      <animateMotion dur="14s" begin="-0.18s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#39c992">
      <animateMotion dur="14s" begin="-0.36s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#2daf7e">
      <animateMotion dur="14s" begin="-0.54s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#258d68">
      <animateMotion dur="14s" begin="-0.72s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#1d6d51">
      <animateMotion dur="14s" begin="-0.9s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
    <rect x="-10" y="-10" width="20" height="20" fill="#174d3b">
      <animateMotion dur="14s" begin="-1.08s" repeatCount="indefinite" calcMode="linear">
        <mpath xlink:href="#snake-route"/>
      </animateMotion>
    </rect>
  </g>
</svg>
