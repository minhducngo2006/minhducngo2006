<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="238" viewBox="0 0 1200 238" role="img" aria-label="CTF divisions: Crypto, OSINT, and Pwn" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
