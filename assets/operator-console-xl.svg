<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="Large Python operator record for Undertaker" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f2eee5" stroke-opacity=".055" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="410" rx="14" fill="#080a0c"/>
  <rect width="1200" height="410" rx="14" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="407" rx="12.5" fill="none" stroke="#d7d2c9" stroke-opacity=".72" stroke-width="3"/>
  <rect x="0" y="0" width="18" height="410" rx="8" fill="#b51224"/>

  <g font-family="'IBM Plex Mono','JetBrains Mono',Consolas,monospace">
    <text x="44" y="48" fill="#d1182b" font-size="22" font-weight="700" letter-spacing="2">OPERATOR.PY // ACTIVE RECORD</text>
    <text x="1156" y="48" text-anchor="end" fill="#d7d2c9" font-size="20" font-weight="700" letter-spacing="1.5">UTR-86-2006</text>
    <path d="M44 66H1156" stroke="#d1182b" stroke-width="3"/>

    <g font-size="31" font-weight="600">
      <text x="44" y="112" fill="#f5f1e8"><tspan fill="#d1182b">operator</tspan><tspan fill="#d7d2c9"> = {</tspan></text>
      <text x="82" y="158" fill="#f5f1e8"><tspan fill="#d1182b">"callsign"</tspan><tspan fill="#d7d2c9">: </tspan><tspan>"Undertaker"</tspan><tspan fill="#d7d2c9">,</tspan></text>
      <text x="82" y="204" fill="#f5f1e8"><tspan fill="#d1182b">"role"</tspan><tspan fill="#d7d2c9">: </tspan><tspan>"Cybersecurity Student &amp; CTF Player"</tspan><tspan fill="#d7d2c9">,</tspan></text>
      <text x="82" y="250" fill="#f5f1e8"><tspan fill="#d1182b">"focus"</tspan><tspan fill="#d7d2c9">: [</tspan><tspan>"Network", "Crypto", "OSINT", "Pwn"</tspan><tspan fill="#d7d2c9">],</tspan></text>
      <text x="82" y="296" fill="#f5f1e8"><tspan fill="#d1182b">"mode"</tspan><tspan fill="#d7d2c9">: </tspan><tspan>"Evidence first"</tspan><tspan fill="#d7d2c9">,</tspan></text>
      <text x="82" y="342" fill="#f5f1e8"><tspan fill="#d1182b">"mission"</tspan><tspan fill="#d7d2c9">: </tspan><tspan>"Build. Verify. Document."</tspan></text>
      <text x="44" y="388" fill="#d7d2c9">}</text>
    </g>

    <rect x="69" y="365" width="18" height="29" fill="#d1182b">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
